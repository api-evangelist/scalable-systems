    url: https://docs.aws.amazon.com/autoscaling/application/APIReference/Welcome.html
- aid: scalable-systems:redis
  name: Redis REST API (Upstash)
  description: >-
    Redis is the dominant distributed in-memory cache and data structure store used to reduce latency
    and database load in scalable systems. Upstash provides a serverless Redis-compatible REST API for
    low-latency caching at scale.
  tags:
  - Caching
  - Distributed Systems
  - In-Memory
  - Low Latency
  humanURL: https://upstash.com/docs/redis/features/restapi
  properties:
  - type: Documentation
    url: https://upstash.com/docs/redis/features/restapi
  - type: GitHub
    url: https://github.com/redis/redis
- aid: scalable-systems:consul
  name: Consul API
  description: >-
    HashiCorp Consul provides service discovery, health checking, key-value storage, and service mesh
    capabilities via a comprehensive REST API. Core component for service registry and dynamic configuration
    in scalable distributed systems.
  tags:
  - Configuration Management
  - High Availability
  - Service Discovery
  - Service Mesh
  humanURL: https://developer.hashicorp.com/consul/api-docs
  properties:
  - type: Documentation
    url: https://developer.hashicorp.com/consul/api-docs
  - type: GitHub
    url: https://github.com/hashicorp/consul
- aid: scalable-systems:etcd
  name: etcd API
  description: >-
    etcd is a strongly consistent, distributed key-value store used as the backing store for Kubernetes
    and many distributed systems. Its gRPC API provides atomic operations, watches, leases, and transactions
    for distributed coordination and consensus.
  tags:
  - Configuration Management
  - Distributed Systems
  - High Availability
  - Kubernetes
  humanURL: https://etcd.io/docs/latest/learning/api/
  properties:
  - type: Documentation
    url: https://etcd.io/docs/latest/learning/api/
  - type: GitHub
    url: https://github.com/etcd-io/etcd
- aid: scalable-systems:celery
  name: Celery Flower API
  description: >-
    Celery is a distributed task queue for Python applications. Flower is Celery's real-time monitoring
    tool that exposes an HTTP API for inspecting workers, tasks, queues, and scheduled jobs in production
    systems.
  tags:
  - Asynchronous
  - Distributed Systems
  - Message Queues
  - Task Queue
  humanURL: https://flower.readthedocs.io/en/latest/api.html
  properties:
  - type: Documentation
    url: https://flower.readthedocs.io/en/latest/api.html
  - type: GitHub
    url: https://github.com/celery/celery
- aid: scalable-systems:nginx-plus
  name: NGINX Plus API
  description: >-
    NGINX Plus provides an advanced REST API for runtime configuration and statistics of upstream server
    groups, virtual servers, and cache zones. Enables dynamic load balancer reconfiguration and real-time
    traffic monitoring without reloads.
  tags:
  - HTTP
  - High Performance
  - Load Balancing
  - Traffic Management
