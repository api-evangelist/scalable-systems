apis:
- aid: scalable-systems:aws-autoscaling
  name: AWS Auto Scaling API
  description: >-
    AWS Auto Scaling monitors applications and automatically adjusts capacity across multiple AWS resources
    including EC2, ECS, Lambda, DynamoDB, and Aurora. The API enables defining scaling policies, target
    tracking, and scheduled scaling for systems that must respond to variable load.
  tags:
  - Auto-Scaling
  - AWS
  - Cloud Infrastructure
  - Scalable Architecture
  tags_raw:
  - Auto Scaling
  - AWS
  - Cloud Infrastructure
  - Scalable Architecture
  humanURL: https://docs.aws.amazon.com/autoscaling/application/APIReference/Welcome.html
